    <!-- Anti-FOUC & Instant Canvas Background Initialization -->
    <script>
      (function() {
        // Storage Migration: wcg_* -> pine_*
        try {
          for (var k in localStorage) {
            if (k.indexOf('wcg_') === 0 && k.indexOf('wcg_virtual_') !== 0) {
              var nk = 'pine_' + k.slice(4);
              if (localStorage.getItem(nk) === null) {
                localStorage.setItem(nk, localStorage.getItem(k));
              }
              localStorage.removeItem(k);
            }
          }
        } catch(e) {}
        
        // Storage Migration: wcg_* -> pine_*
        try {
          for (var k in localStorage) {
            if (k.indexOf('wcg_') === 0 && k.indexOf('wcg_virtual_') !== 0) {
              var nk = 'pine_' + k.slice(4);
              if (localStorage.getItem(nk) === null) {
                localStorage.setItem(nk, localStorage.getItem(k));
              }
              localStorage.removeItem(k);
            }
          }
        } catch(e) {}
        
        // Storage Migration: wcg_* -> pine_*
        try {
          for (var k in localStorage) {
            if (k.indexOf('wcg_') === 0 && k.indexOf('wcg_virtual_') !== 0) {
              var nk = 'pine_' + k.slice(4);
              if (localStorage.getItem(nk) === null) {
                localStorage.setItem(nk, localStorage.getItem(k));
              }
              localStorage.removeItem(k);
            }
          }
        } catch(e) {}
        
        // Storage Migration: wcg_* -> pine_*
        try {
          for (var k in localStorage) {
            if (k.indexOf('wcg_') === 0 && k.indexOf('wcg_virtual_') !== 0) {
              var nk = 'pine_' + k.slice(4);
              if (localStorage.getItem(nk) === null) {
                localStorage.setItem(nk, localStorage.getItem(k));
              }
              localStorage.removeItem(k);
            }
          }
        } catch(e) {}
        
        var host = window.location.hostname.toLowerCase();
        var pathname = window.location.pathname.toLowerCase();
        var hash = window.location.hash.toLowerCase();
        if (host.includes('admin-universal-mall') || host.includes('admin-code-game-shop') || host.startsWith('admin.')) {
          document.title = 'Quản Trị Hệ Thống | Pine Universal Mall';
          if (window.location.pathname === '/' || window.location.pathname === '') {
            window.location.replace('/admin' + (window.location.hash || '#/dashboard'));
            return;
          }
        }
        var isShopee = pathname === '/' || pathname.startsWith('/test1') || hash.includes('test1') || !pathname.startsWith('/game');
        var savedTheme = isShopee ? 'light' : 'dark';
        try {
          if (isShopee) {
            var st = localStorage.getItem('wcg_shopee_theme');
            if (st === 'dark') savedTheme = 'dark';
            else savedTheme = 'light';
          } else {
            var t = localStorage.getItem('wcg_theme');
            if (t === 'light') savedTheme = 'light';
          }
        } catch(e) {}
        var metaCs = document.querySelector('meta[name="color-scheme"]');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.backgroundColor = '#FFFFFF';
          document.documentElement.style.colorScheme = 'light';
          if (metaCs) metaCs.setAttribute('content', 'light');
          if (document.body) {
            document.body.style.backgroundColor = '#FFFFFF';
          }
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.backgroundColor = '#0B0D19';
          document.documentElement.style.colorScheme = 'dark';
          if (metaCs) metaCs.setAttribute('content', 'dark');
          if (document.body) {
            document.body.style.backgroundColor = '#0B0D19';
          }
        }
      })();
    </script>

    <!-- Persistent Splash Preloader Overlay covering entire screen until React hydrates -->
    <div id="app-preloader">
      <div class="loader-wrapper">
        <div class="loader"></div>
        <div class="loader-center-avatar">
          <img
            src="/logo.webp"
            alt="Code Game Logo"
            width="102"
            height="102"
            fetchpriority="high"
            loading="eager"
            decoding="async"
            onerror="this.onerror=null;this.src='/brand_loader_logo.jpg';"
          />
        </div>
      </div>
      <div style="display:flex;gap:4px;">
        <span class="loader-letter" style="animation-delay:0s">C</span>
        <span class="loader-letter" style="animation-delay:0.1s">O</span>
        <span class="loader-letter" style="animation-delay:0.2s">D</span>
        <span class="loader-letter" style="animation-delay:0.3s">E</span>
        <span class="loader-letter" style="animation-delay:0.4s">&nbsp;</span>
        <span class="loader-letter" style="animation-delay:0.5s">G</span>
        <span class="loader-letter" style="animation-delay:0.6s">A</span>
        <span class="loader-letter" style="animation-delay:0.7s">M</span>
        <span class="loader-letter" style="animation-delay:0.8s">E</span>
      </div>
    </div>

    <div id="root"></div>
    <script>
      (function() {
        var timer = setTimeout(function() {
          var p = document.getElementById('app-preloader');
          if (p) {
            p.style.opacity = '0';
            p.style.pointerEvents = 'none';
            setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 360);
          }
        }, 2200);
        window.addEventListener('load', function() {
          setTimeout(function() {
            var p = document.getElementById('app-preloader');
            if (p) {
              p.style.opacity = '0';
              p.style.pointerEvents = 'none';
              setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 360);
            }
          }, 600);
        });
      })();
    </script>
